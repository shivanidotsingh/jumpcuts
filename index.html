        const galleryContainer = document.getElementById('gallery-container');

        async function loadImages() {
            if (API_KEY === 'PASTE_YOUR_API_KEY_HERE') {
                galleryContainer.innerHTML = '<p style="padding: 40px; color: #666;">API Key needed. Paste your key in the HTML.</p>';
                return;
            }

            try {
                const query = `'${FOLDER_ID}' in parents and trashed=false`;
                const url = `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(query)}&spaces=drive&fields=files(id,name)&pageSize=1000&key=${API_KEY}`;
                
                const response = await fetch(url);
                const data = await response.json();

                if (!data.files) {
                    galleryContainer.innerHTML = '<p style="padding: 40px; color: #666;">Error loading images. Check API key & folder permissions.</p>';
                    return;
                }

                const fileMap = {};
                data.files.forEach(file => {
                    fileMap[file.name] = file.id;
                });

                imageOrder.forEach((filename) => {
                    if (fileMap[filename] && photoMetadata[filename]) {
                        const driveId = fileMap[filename];
                        const driveUrl = `https://lh3.googleusercontent.com/d/${driveId}=w1000`;
                        const meta = photoMetadata[filename];
                        
                        const item = document.createElement('div');
                        item.className = 'gallery-item';
                        item.setAttribute('data-caption', meta.caption);
                        
                        const img = document.createElement('img');
                        img.src = driveUrl;
                        img.alt = filename;
                        
                        item.appendChild(img);
                        galleryContainer.appendChild(item);
                    }
                });
            } catch (error) {
                galleryContainer.innerHTML = `<p style="padding: 40px; color: #666;">Error: ${error.message}</p>`;
            }
        }

        // Original caption hover behavior
        galleryContainer.addEventListener('mouseover', (event) => {
            const galleryItem = event.target.closest('.gallery-item');
            if (galleryItem) {
                const caption = galleryItem.getAttribute('data-caption');
                if (caption && caption.trim() !== '') {
                    captionDisplay.textContent = caption;
                    captionDisplay.style.display = 'block';
                } else {
                    captionDisplay.style.display = 'none';
                }
            }
        });

        galleryContainer.addEventListener('mouseout', () => {
            captionDisplay.textContent = '';
            captionDisplay.style.display = 'none';
        });
